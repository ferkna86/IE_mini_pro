# Edit values here, or override on the CLI, e.g. --set model.svm.C=0.5

[data]
train_path = "data/train.json"
test_path = "data/test.json"
val_size = 0.2
seed = 42

[model]
name = "tfidf_svm"

[model.tfidf]  # sklearn TfidfVectorizer kwargs
ngram_range = [1, 2]
sublinear_tf = true
min_df = 1
# max_features = 50000
# stop_words = "english"

[model.svm]  # sklearn LinearSVC kwargs
C = 1.0
max_iter = 10000
random_state = 42
# class_weight = "balanced"   # classes are ~85% positive / 15% negative
